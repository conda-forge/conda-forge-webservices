name: automerge

run-name: >-
  automerge: conda-forge/${{ inputs.repo }}@${{ inputs.sha }} [uuid=${{ inputs.uuid }}]

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'the repository to run on'
        required: true
        type: string
      sha:
        description: 'the commit SHA to possibly merge'
        required: true
        type: string
      uuid:
        description: 'a unique identifier for this run'
        required: true
        type: string

env:
  PY_COLORS: 1

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  automerge:
    name: automerge
    runs-on: "ubuntu-slim"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: setup conda
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: "2.7.0-0"
          environment-file: conda-lock.yml
          environment-name: webservices
          condarc: |
            show_channel_urls: true
            channel_priority: strict
            channels:
              - conda-forge

      - name: generate token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CF_CURATOR_APP_ID }}
          private-key: ${{ secrets.CF_CURATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: install code
        run: |
          pip install --no-deps --no-build-isolation -e .

      - name: automerge
        run: |
          git config --global user.name "conda-forge-webservices[bot]"
          git config --global user.email "91080706+conda-forge-webservices[bot]@users.noreply.github.com"
          git config --global pull.rebase false

          conda-forge-webservices-automerge \
            --repo=${{ inputs.repo }} \
            --sha=${{ inputs.sha }}
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          GH_TOKEN_FOR_ADMIN: ${{ secrets.CF_ADMIN_GITHUB_TOKEN }}

