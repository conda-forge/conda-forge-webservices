name: webservices
channels:
  - conda-forge
platforms:
  - linux-64
dependencies:
  - anaconda-client >=1.8.0
  - cachetools
  - conda >=25.9.0
  - conda-build >=25.9.0
  - conda-forge-metadata >=0.12.0
  - conda-forge-pinning
  - conda-forge-tick >=2026.9.46
  - conda-forge-feedstock-ops >=0.20.1
  - conda-recipe-manager >=0.10.6
  - conda-smithy >=2026.9.19  # for schema.TrustedPublisher
  - conda-souschef
  - cryptography >=39
  - python-dateutil
  - git
  - gitpython
  - lxml
  - mock
  - parameterized
  - pip
  - pydantic >=2.11
  - pygithub >=2.10.0
  - pyjwt >=2.10.1  # this pin is because 2.10.0 matched iss by prefix (CVE-2024-53861)
  - python =3.12.*
  - pytz
  - pyyaml
  - rattler-build >=0.75.0
  - requests
  - ruamel.yaml >=0.16
  - ruamel.yaml.jinja2
  - setuptools
  - setuptools_scm >=8
  - shellcheck
  - tini
  - tornado
  - tqdm
  # dev dependencies
  - flaky
  - pytest
  - pytest-xdist
