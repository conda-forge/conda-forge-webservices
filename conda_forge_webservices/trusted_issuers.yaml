# The OIDC issuers whose tokens conda-forge accepts for trusted publishing.
# A feedstock's trusted_publishers can only name an issuer listed here, and
# deleting an entry stops its tokens being accepted from the next deploy.
#
#   issuer    the token's `iss`, exactly as the issuer writes it
#   provider  the kind of trusted_publishers entry that may name it

- issuer: https://token.actions.githubusercontent.com
  provider: github

- issuer: https://gitlab.com
  provider: gitlab

- issuer: https://gitlab.cern.ch
  provider: gitlab
