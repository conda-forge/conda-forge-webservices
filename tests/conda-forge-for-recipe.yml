bot:
  automerge: true
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  pkg_format: 2
provider:
  linux_64: github_actions
  osx_arm64: azure
conda_build_tool: rattler-build
# the live tests of conda-forge-webservices and conda-forge/release ask for
# version updates from these workflows
trusted_publishers:
  - provider: github
    repository: conda-forge/conda-forge-webservices
    repository_owner_id: 11897326
    workflow: tests.yml
  - provider: github
    repository: conda-forge/release
    repository_owner_id: 11897326
    workflow: tests.yml
